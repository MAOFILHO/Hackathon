[project]
name = "finagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "fpdf2>=2.8.9",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.9",
    "langgraph>=1.2.14",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
